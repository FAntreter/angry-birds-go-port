name: Android ARM64 bridge build

on:
  push:
    paths:
      - "ABGo_stage23_work/ABGo_port_work/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: ABGo_stage23_work/ABGo_port_work
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build git curl unzip libboost-all-dev

      - name: Bootstrap Android NDK and Dynarmic
        run: bash scripts/bootstrap_android_deps.sh

      - name: Run static source validators
        run: |
          set -e
          for f in tools/validate_*.py; do
            echo "== $f =="
            python3 "$f"
          done

      - name: Generate current ARM32 import-resolution audit
        run: python3 tools/audit_guest_import_resolution.py

      - name: Scan startup update and network strings
        run: python3 tools/scan_update_strings.py

      - name: Build Android ARM64 bridge
        run: bash scripts/build_android.sh

      - name: Stage ARM32 guest libraries beside bridge
        run: bash scripts/package_guest_libs.sh target_libs build-android-arm64

      - name: Upload bridge and guest libraries
        uses: actions/upload-artifact@v4
        with:
          name: AngryBirdsGoBridge-arm64-v8a
          path: ABGo_stage23_work/ABGo_port_work/build-android-arm64/*.so
          if-no-files-found: error

      - name: Upload update/network string inventory
        uses: actions/upload-artifact@v4
        with:
          name: AngryBirdsGo-update-network-inventory
          path: ABGo_stage23_work/ABGo_port_work/reports/update_network_string_inventory.md
          if-no-files-found: error

      - name: Upload current import audit report
        uses: actions/upload-artifact@v4
        with:
          name: AngryBirdsGo-import-audit
          path: ABGo_stage23_work/ABGo_port_work/reports/stage9_guest_import_resolution.md
          if-no-files-found: error
